        type: string
        format: uuid
      quantity:
        type: integer
      unitPrice:
        type: number
      product:
        $ref: '#/components/schemas/Product'
  PharmacyOrder:
    type: object
    properties:
      id:
        type: string
        format: uuid
      patientId:
        type: string
        format: uuid
