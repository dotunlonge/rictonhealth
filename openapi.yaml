openapi: 3.0.0
info:
  title: Ricton API
  version: 1.0.0
  description: API documentation for the Ricton Backend
servers:
  - url: http://localhost:8000
    description: Local Gateway
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
        role:
          type: string
          enum:
            - PATIENT
            - CONSULTANT
            - PHARMACIST
            - HOSPITAL_ADMIN
            - SUPER_ADMIN
        firstName:
          type: string
        lastName:
          type: string
        consentVersion:
          type: string
          minLength: 1
      required:
        - password
        - role
        - consentVersion
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
      required:
        - password
    SendOtpInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
    VerifyOtpInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - otp
    OAuthInput:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          enum:
            - PATIENT
            - CONSULTANT
      required:
        - token
    RefreshTokenInput:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    PasswordResetInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
        newPassword:
          type: string
          minLength: 8
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
      required:
        - otp
        - newPassword
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            refreshToken:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                role:
                  type: string
                status:
                  type: string
              required:
                - id
                - email
                - phone
                - role
                - status
          required:
            - token
            - user
      required:
        - success
        - data
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    VerifyPhoneInput:
      type: object
      properties:
        phone:
          type: string
      required:
        - phone
    VerifyConfirmInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - otp
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
        patientProfile:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            dateOfBirth:
              type: string
              nullable: true
            gender:
              type: string
              nullable: true
            bloodType:
              type: string
              nullable: true
            allergies:
              type: array
              nullable: true
              items:
                type: string
            medicalHistory:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  condition:
                    type: string
                    minLength: 1
                  diagnosedAt:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  notes:
                    type: string
                required:
                  - condition
            emergencyContact:
              type: object
              nullable: true
              properties:
                name:
                  type: string
                relationship:
                  type: string
                phone:
                  type: string
              required:
                - name
                - relationship
                - phone
          required:
            - firstName
            - lastName
            - dateOfBirth
            - gender
            - bloodType
        providerProfile:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            specialty:
              type: string
              nullable: true
            consultationFee:
              type: number
              nullable: true
          required:
            - firstName
            - lastName
            - specialty
            - consultationFee
      required:
        - id
        - email
        - phone
        - role
        - status
    GetUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/UserProfile'
      required:
        - success
        - data
    UpdateProfileInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        bloodType:
          type: string
        allergies:
          type: array
          items:
            type: string
        specialty:
          type: string
        consultationFee:
          type: number
        title:
          type: string
        pharmacyName:
          type: string
    AvatarUploadInput:
      type: object
      properties:
        fileType:
          type: string
          minLength: 1
      required:
        - fileType
    MedicalHistoryInput:
      type: object
      properties:
        medicalHistory:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
                minLength: 1
              diagnosedAt:
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
              notes:
                type: string
            required:
              - condition
      required:
        - medicalHistory
    GetProvidersQuery:
      type: object
      properties:
        specialty:
          type: string
        name:
          type: string
        limit:
          type: string
        offset:
          type: string
    HospitalDashboardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            hospital:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
                logoUrl:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
                createdAt:
                  type: string
              required:
                - id
                - name
                - phone
                - email
                - logoUrl
                - isActive
                - createdAt
            stats:
              type: object
              properties:
                totalDoctors:
                  type: number
                totalAppointments:
                  type: number
                activePatients:
                  type: number
              required:
                - totalDoctors
                - totalAppointments
                - activePatients
          required:
            - hospital
            - stats
      required:
        - success
        - data
    ProviderDashboardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            stats:
              type: object
              properties:
                totalAppointments:
                  type: number
                pendingAppointments:
                  type: number
                completedAppointments:
                  type: number
                totalEarnings:
                  anyOf:
                    - type: number
                    - type: string
              required:
                - totalAppointments
                - pendingAppointments
                - completedAppointments
                - totalEarnings
            upcomingAppointments:
              type: array
              items:
                nullable: true
          required:
            - stats
            - upcomingAppointments
      required:
        - success
        - data
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        hospitalId:
          type: string
          nullable: true
          format: uuid
        scheduledAt:
          type: string
        durationMinutes:
          type: number
        type:
          type: string
          enum:
            - IN_PERSON
            - VIDEO
        status:
          type: string
        notes:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        reminderSentAt:
          type: string
          nullable: true
        cancelledBy:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - patientId
        - providerId
        - hospitalId
        - scheduledAt
        - durationMinutes
        - type
        - status
        - notes
        - cancellationReason
        - reason
        - reminderSentAt
        - cancelledBy
        - createdAt
        - updatedAt
    GetSlotsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: string
      required:
        - success
        - data
    BookAppointmentInput:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        hospitalId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - IN_PERSON
            - VIDEO
        notes:
          type: string
        reason:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
      required:
        - providerId
        - scheduledAt
        - type
    GetAppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Appointment'
      required:
        - success
        - data
    ListAppointmentsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/Appointment'
            meta:
              type: object
              properties:
                total:
                  type: number
                limit:
                  type: number
                offset:
                  type: number
                hasMore:
                  type: boolean
              required:
                - total
                - limit
                - offset
                - hasMore
          required:
            - appointments
            - meta
      required:
        - success
        - data
    CreateAppointment:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - IN_PERSON
            - VIDEO
        reason:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        hospitalId:
          type: string
          format: uuid
      required:
        - providerId
        - scheduledAt
        - type
    UpdateAppointmentStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
            - NO_SHOW
        cancellationReason:
          type: string
      required:
        - status
    GetAvailabilityQuery:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
        - providerId
        - date
    GetAppointmentsQuery:
      type: object
      properties:
        status:
          type: string
        type:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        limit:
          type: string
        offset:
          type: string
    PrescriptionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prescriptionId:
          type: string
          format: uuid
        drugName:
          type: string
        dosage:
          type: string
        quantity:
          type: number
        frequency:
          type: string
        duration:
          type: string
        instructions:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - prescriptionId
        - drugName
        - dosage
        - quantity
        - frequency
        - duration
        - instructions
        - createdAt
    Prescription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          nullable: true
          format: uuid
        patientId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        pharmacyId:
          type: string
          nullable: true
          format: uuid
        status:
          type: string
        signedAt:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItem'
      required:
        - id
        - appointmentId
        - patientId
        - providerId
        - pharmacyId
        - status
        - signedAt
        - notes
        - createdAt
        - updatedAt
    CreatePrescriptionInput:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        notes:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              drugName:
                type: string
                minLength: 1
              dosage:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              frequency:
                type: string
                minLength: 1
              duration:
                type: string
                minLength: 1
              instructions:
                type: string
            required:
              - drugName
              - dosage
              - quantity
              - frequency
              - duration
      required:
        - patientId
        - items
    SignPrescriptionInput:
      type: object
      properties:
        otpCode:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - otpCode
    GetPrescriptionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Prescription'
      required:
        - success
        - data
    ListPrescriptionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Prescription'
      required:
        - success
        - data
    TelemedicineRoom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          nullable: true
          format: uuid
        providerId:
          type: string
          format: uuid
        roomType:
          type: string
          enum:
            - ONE_ON_ONE
            - MDT
        externalRoomId:
          type: string
        externalRoomUrl:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - CREATED
            - ACTIVE
            - ENDED
        startedAt:
          type: string
          nullable: true
        endedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - appointmentId
        - providerId
        - roomType
        - externalRoomId
        - externalRoomUrl
        - status
        - startedAt
        - endedAt
        - createdAt
        - updatedAt
    GetTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            room:
              $ref: '#/components/schemas/TelemedicineRoom'
          required:
            - token
            - room
      required:
        - success
        - data
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - addressLine1
        - addressLine2
        - city
        - state
        - country
        - postalCode
        - latitude
        - longitude
        - isDefault
        - createdAt
    CreateAddressInput:
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 5
        addressLine2:
          type: string
        city:
          type: string
          minLength: 2
        state:
          type: string
          minLength: 2
        country:
          type: string
          default: Nigeria
        postalCode:
          type: string
          pattern: ^\d{6}$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean
          default: false
      required:
        - addressLine1
        - city
        - state
    UpdateAddressInput:
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 5
        addressLine2:
          type: string
        city:
          type: string
          minLength: 2
        state:
          type: string
          minLength: 2
        country:
          type: string
        postalCode:
          type: string
          pattern: ^\d{6}$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean
    ValidateAddressInput:
      type: object
      properties:
        addressLine1:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
      required:
        - addressLine1
        - city
        - state
    AddressListResponse:
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
        - addresses
    ProductsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            products:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  price:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                  category:
                    type: string
                  imageUrl:
                    type: string
                    nullable: true
                    format: uri
                  stock:
                    type: integer
                    minimum: 0
                  isActive:
                    type: boolean
                  pharmacyId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - description
                  - price
                  - category
                  - imageUrl
                  - stock
                  - isActive
                  - pharmacyId
                  - createdAt
            total:
              type: number
            limit:
              type: number
            offset:
              type: number
          required:
            - products
            - total
            - limit
            - offset
      required:
        - success
        - data
    ProductDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
              nullable: true
            price:
              type: number
              minimum: 0
              exclusiveMinimum: true
            category:
              type: string
            imageUrl:
              type: string
              nullable: true
              format: uri
            stock:
              type: integer
              minimum: 0
            isActive:
              type: boolean
            pharmacyId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - name
            - description
            - price
            - category
            - imageUrl
            - stock
            - isActive
            - pharmacyId
            - createdAt
      required:
        - success
        - data
    CategoriesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: string
      required:
        - success
        - data
    OrdersListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            orders:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  pharmacyId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: &a1
                      - PENDING
                      - CONFIRMED
                      - PROCESSING
                      - SHIPPED
                      - DELIVERED
                      - CANCELLED
                  totalAmount:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                  deliveryType:
                    type: string
                    enum: &a2
                      - HOME_DELIVERY
                      - PICKUP
                  deliveryAddress:
                    type: string
                    nullable: true
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                          format: uuid
                        quantity:
                          type: integer
                          minimum: 0
                          exclusiveMinimum: true
                        unitPrice:
                          type: number
                          minimum: 0
                          exclusiveMinimum: true
                      required:
                        - productId
                        - quantity
                        - unitPrice
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - userId
                  - pharmacyId
                  - status
                  - totalAmount
                  - deliveryType
                  - deliveryAddress
                  - items
                  - createdAt
            total:
              type: number
            limit:
              type: number
            offset:
              type: number
          required:
            - orders
            - total
            - limit
            - offset
      required:
        - success
        - data
    OrderDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            pharmacyId:
              type: string
              format: uuid
            status:
              type: string
              enum: *a1
            totalAmount:
              type: number
              minimum: 0
              exclusiveMinimum: true
            deliveryType:
              type: string
              enum: *a2
            deliveryAddress:
              type: string
              nullable: true
            items:
              type: array
              items:
                type: object
                properties:
                  productId:
                    type: string
                    format: uuid
                  quantity:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  unitPrice:
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                required:
                  - productId
                  - quantity
                  - unitPrice
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - userId
            - pharmacyId
            - status
            - totalAmount
            - deliveryType
            - deliveryAddress
            - items
            - createdAt
      required:
        - success
        - data
    CreateOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            userId:
