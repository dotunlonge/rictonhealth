        type: string
        format: uuid
      status:
        type: string
        enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      deliveryType:
        type: string
        enum: [DELIVERY, PICKUP]
      deliveryAddress:
        type: object
      totalAmount:
        type: number
      items:
        type: array
        items:
          $ref: '#/components/schemas/OrderItem'
      createdAt:
        type: string
        format: date-time
  CreateProductInput:
    type: object
    required:
