openapi: 3.0.0
info:
  title: Ricton API
  version: 1.0.0
  description: API documentation for the Ricton Backend
servers:
  - url: http://localhost:8000
    description: Local Gateway
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - addressLine1
        - addressLine2
        - city
        - state
        - country
        - postalCode
        - latitude
        - longitude
        - isDefault
        - createdAt
    CreateAddressInput:
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 5
        addressLine2:
          type: string
        city:
          type: string
          minLength: 2
        state:
          type: string
          minLength: 2
        country:
          type: string
          default: Nigeria
        postalCode:
          type: string
          pattern: ^\d{6}$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean
          default: false
      required:
        - addressLine1
        - city
        - state
    UpdateAddressInput:
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 5
        addressLine2:
          type: string
        city:
          type: string
          minLength: 2
        state:
          type: string
          minLength: 2
        country:
          type: string
        postalCode:
          type: string
          pattern: ^\d{6}$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean
    ValidateAddressInput:
      type: object
      properties:
        addressLine1:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
      required:
        - addressLine1
        - city
        - state
    AddressListResponse:
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
      required:
        - addresses
    AdminUserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                nullable: true
                format: email
              phone:
                type: string
                nullable: true
              firstName:
                type: string
              lastName:
                type: string
              role:
                type: string
                enum:
                  - PATIENT
                  - CONSULTANT
                  - PHARMACIST
                  - HOSPITAL_ADMIN
                  - SUPER_ADMIN
              status:
                type: string
                enum:
                  - ACTIVE
                  - SUSPENDED
                  - PENDING
                  - DEACTIVATED
              isVerified:
                type: boolean
              createdAt:
                type: string
                format: date-time
              lastLoginAt:
                type: string
                nullable: true
                format: date-time
            required:
              - id
              - email
              - phone
              - firstName
              - lastName
              - role
              - status
              - isVerified
              - createdAt
              - lastLoginAt
        meta:
          type: object
          properties:
            total:
              type: number
            page:
              type: number
            limit:
              type: number
            totalPages:
              type: number
          required:
            - total
            - page
            - limit
            - totalPages
      required:
        - users
        - meta
    AdminProviderPendingListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              userId:
                type: string
              firstName:
                type: string
              lastName:
                type: string
              specialty:
                type: string
              licenseNumber:
                type: string
              submittedAt:
                type: string
                format: date-time
              documents:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    url:
                      type: string
                    status:
                      type: string
                      enum:
                        - PENDING
                        - APPROVED
                        - REJECTED
                  required:
                    - type
                    - url
                    - status
            required:
              - id
              - userId
              - firstName
              - lastName
              - specialty
              - licenseNumber
              - submittedAt
              - documents
        meta:
          type: object
          properties:
            total:
              type: number
            page:
              type: number
            limit:
              type: number
          required:
            - total
            - page
            - limit
      required:
        - providers
        - meta
    AdminHospitalResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - address
        - email
        - phone
        - isActive
        - createdAt
    AdminAuditLogResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              actorId:
                type: string
                nullable: true
              action:
                type: string
              resourceType:
                type: string
              resourceId:
                type: string
                nullable: true
              metadata:
                type: object
                additionalProperties:
                  nullable: true
              ipAddress:
                type: string
                nullable: true
              userAgent:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - actorId
              - action
              - resourceType
              - resourceId
              - metadata
              - ipAddress
              - userAgent
              - createdAt
        meta:
          type: object
          properties:
            total:
              type: number
            page:
              type: number
            limit:
              type: number
          required:
            - total
            - page
            - limit
      required:
        - logs
        - meta
    AdminAnalyticsResponse:
      type: object
      properties:
        overview:
          type: object
          properties:
            totalUsers:
              type: number
            totalProviders:
              type: number
            totalHospitals:
              type: number
            totalAppointments:
              type: number
            totalRevenue:
              type: number
            activeSubscriptions:
              type: number
          required:
            - totalUsers
            - totalProviders
            - totalHospitals
            - totalAppointments
            - totalRevenue
            - activeSubscriptions
        growth:
          type: object
          properties:
            userGrowth:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  count:
                    type: number
                required:
                  - date
                  - count
            appointmentGrowth:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  count:
                    type: number
                required:
                  - date
                  - count
            revenueGrowth:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  amount:
                    type: number
                required:
                  - date
                  - amount
          required:
            - userGrowth
            - appointmentGrowth
            - revenueGrowth
        topProviders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              appointmentsCount:
                type: number
              revenue:
                type: number
              rating:
                type: number
                nullable: true
            required:
              - id
              - name
              - appointmentsCount
              - revenue
              - rating
      required:
        - overview
        - growth
        - topProviders
    AnalyticsRangeQuery:
      type: object
      properties:
        range:
          type: string
          enum:
            - 7d
            - 30d
            - 90d
            - 12m
            - all
          default: 30d
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AnalyticsOverviewResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalUsers:
              type: number
            totalPatients:
              type: number
            totalProviders:
              type: number
            totalPharmacists:
              type: number
            totalHospitals:
              type: number
            totalAppointments:
              type: number
            completedAppointments:
              type: number
            totalRevenue:
              type: number
            activeSubscriptions:
              type: number
          required:
            - totalUsers
            - totalPatients
            - totalProviders
            - totalPharmacists
            - totalHospitals
            - totalAppointments
            - completedAppointments
            - totalRevenue
            - activeSubscriptions
      required:
        - success
        - data
    AnalyticsAppointmentsTrendResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            total:
              type: number
            byStatus:
              type: object
              additionalProperties:
                type: number
            byType:
              type: object
              additionalProperties:
                type: number
            trend:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: string
                  count:
                    type: number
                required:
                  - period
                  - count
          required:
            - total
            - byStatus
            - byType
            - trend
      required:
        - success
        - data
    AnalyticsRevenueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalRevenue:
              type: number
            byType:
              type: object
              additionalProperties:
                type: number
            trend:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: string
                  amount:
                    type: number
                required:
                  - period
                  - amount
          required:
            - totalRevenue
            - byType
            - trend
      required:
        - success
        - data
    AnalyticsUserGrowthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalUsers:
              type: number
            byRole:
              type: object
              additionalProperties:
                type: number
            trend:
              type: array
              items:
                type: object
                properties:
                  period:
                    type: string
                  count:
                    type: number
                required:
                  - period
                  - count
          required:
            - totalUsers
            - byRole
            - trend
      required:
        - success
        - data
    AnalyticsProviderPerformanceResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            providers:
              type: array
              items:
                type: object
                properties:
                  providerId:
                    type: string
                  name:
                    type: string
                  specialty:
                    type: string
                    nullable: true
                  appointmentCount:
                    type: number
                  completedCount:
                    type: number
                  rating:
                    type: number
                    nullable: true
                required:
                  - providerId
                  - name
                  - specialty
                  - appointmentCount
                  - completedCount
                  - rating
            total:
              type: number
            limit:
              type: number
            offset:
              type: number
          required:
            - providers
            - total
            - limit
            - offset
      required:
        - success
        - data
    AnalyticsPharmacyMetricsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalPharmacies:
              type: number
            verifiedPharmacies:
              type: number
            totalOrders:
              type: number
            ordersByStatus:
              type: object
              additionalProperties:
                type: number
            totalOrderValue:
              type: number
          required:
            - totalPharmacies
            - verifiedPharmacies
            - totalOrders
            - ordersByStatus
            - totalOrderValue
      required:
        - success
        - data
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        hospitalId:
          type: string
          nullable: true
          format: uuid
        scheduledAt:
          type: string
        durationMinutes:
          type: number
        type:
          type: string
          enum:
            - IN_PERSON
            - VIDEO
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
            - NO_SHOW
        notes:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        reminderSentAt:
          type: string
          nullable: true
        cancelledBy:
          type: string
          nullable: true
          enum:
            - PATIENT
            - CONSULTANT
            - PHARMACIST
            - HOSPITAL_ADMIN
            - SUPER_ADMIN
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - patientId
        - providerId
        - hospitalId
        - scheduledAt
        - durationMinutes
        - type
        - status
        - notes
        - cancellationReason
        - reason
        - reminderSentAt
        - cancelledBy
        - createdAt
        - updatedAt
    GetSlotsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: string
      required:
        - success
        - data
    BookAppointmentInput:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        hospitalId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - IN_PERSON
            - VIDEO
        notes:
          type: string
        reason:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 480
      required:
        - providerId
        - scheduledAt
        - type
    GetAppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Appointment'
      required:
        - success
        - data
    ListAppointmentsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/Appointment'
            meta:
              type: object
              properties:
                total:
                  type: number
                limit:
                  type: number
                offset:
                  type: number
                hasMore:
                  type: boolean
              required:
                - total
                - limit
                - offset
                - hasMore
          required:
            - appointments
            - meta
      required:
        - success
        - data
    CreateAppointment:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - IN_PERSON
            - VIDEO
        reason:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 480
        hospitalId:
          type: string
          format: uuid
      required:
        - providerId
        - scheduledAt
        - type
    UpdateAppointmentStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
            - NO_SHOW
        cancellationReason:
          type: string
        waivedReason:
          type: string
          maxLength: 500
        followUpAt:
          type: string
          format: date-time
      required:
        - status
    RescheduleAppointment:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 480
      required:
        - scheduledAt
    GetAvailabilityQuery:
      type: object
      properties:
        providerId:
          type: string
          format: uuid
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        timezone:
          type: string
      required:
        - date
    SetAvailabilityInput:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Monday..6=Sunday, evaluated in UTC
        startTime:
          type: string
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Window start, UTC HH:MM
        endTime:
          type: string
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Window end, UTC HH:MM
        slotDurationMinutes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 480
          default: 30
        isActive:
          type: boolean
          default: true
      required:
        - dayOfWeek
        - startTime
        - endTime
    GetAppointmentsQuery:
      type: object
      properties:
        status:
          type: string
        type:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        limit:
          type: string
        offset:
          type: string
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
        role:
          type: string
          enum:
            - PATIENT
            - CONSULTANT
            - PHARMACIST
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
        consentVersion:
          type: string
          minLength: 1
      required:
        - password
        - role
        - consentVersion
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        totpCode:
          type: string
        rememberMe:
          type: boolean
      required:
        - password
    SendOtpInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
    VerifyOtpInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - otp
    OAuthInput:
      type: object
      properties:
        token:
          type: string
        role:
          anyOf:
            - type: string
              enum:
                - PATIENT
                - CONSULTANT
                - PHARMACIST
            - type: string
              enum:
                - ''
      required:
        - token
    RefreshTokenInput:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    PasswordResetInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
        newPassword:
          type: string
          minLength: 8
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
      required:
        - otp
        - newPassword
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            refreshToken:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                role:
                  type: string
                status:
                  type: string
              required:
                - id
                - email
                - phone
                - role
                - status
          required:
            - token
            - user
      required:
        - success
        - data
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    VerifyPhoneInput:
      type: object
      properties:
        phone:
          type: string
      required:
        - phone
    VerifyConfirmInput:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
        - otp
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$
      required:
        - currentPassword
        - newPassword
    NotificationsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            notifications:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  type:
                    type: string
                    enum: &a1
                      - EMAIL
                      - SMS
                      - PUSH
                      - IN_APP
                  channel:
                    type: string
                    enum: &a2
                      - EMAIL
                      - SMS
                      - PUSH
                      - IN_APP
                  title:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                    additionalProperties:
                      nullable: true
                  isRead:
                    type: boolean
                  readAt:
                    type: string
                    nullable: true
                    format: date-time
                  sentAt:
                    type: string
                    nullable: true
                    format: date-time
                  deliveredAt:
                    type: string
                    nullable: true
                    format: date-time
                  failedAt:
                    type: string
                    nullable: true
                    format: date-time
                  failureReason:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - userId
                  - type
                  - channel
                  - title
                  - message
                  - data
                  - isRead
                  - readAt
                  - sentAt
                  - deliveredAt
                  - failedAt
                  - failureReason
                  - createdAt
            total:
              type: number
            unreadCount:
              type: number
            limit:
              type: number
            offset:
              type: number
          required:
            - notifications
            - total
            - unreadCount
            - limit
            - offset
      required:
        - success
        - data
    NotificationDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            type:
              type: string
              enum: *a1
            channel:
              type: string
              enum: *a2
            title:
              type: string
            message:
              type: string
            data:
              type: object
              nullable: true
              additionalProperties:
                nullable: true
            isRead:
              type: boolean
            readAt:
              type: string
              nullable: true
