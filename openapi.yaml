paths:
  /api/addresses:
    get:
      description: List all addresses for the current user
      tags:
        - Addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AddressListResponse'
                required:
                  - success
                  - data
    post:
      description: Create a new address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressInput'
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - success
                  - data
  '/api/addresses/{id}':
    get:
      description: Get address by ID
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - success
                  - data
    put:
      description: Update an existing address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressInput'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - success
                  - data
    delete:
      description: Delete an address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
  '/api/addresses/{id}/set-default':
    patch:
      description: Set an address as the default
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address set as default
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Address'
                required:
                  - success
                  - data
  /api/addresses/validate:
    post:
      description: Validate an address format
      tags:
        - Addresses
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateAddressInput'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      isValid:
                        type: boolean
                      normalizedAddress:
                        type: object
                        properties:
                          addressLine1:
                            type: string
                          city:
                            type: string
                          state:
                            type: string
                          country:
                            type: string
                          postalCode:
                            type: string
                            nullable: true
                        required:
                          - addressLine1
                          - city
                          - state
                          - country
                          - postalCode
                    required:
                      - isValid
                      - normalizedAddress
                required:
                  - success
                  - data
  /api/analytics/overview:
    get:
      summary: Platform overview analytics
      security:
        - bearerAuth: []
      responses:
        '200':
