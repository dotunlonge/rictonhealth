            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete product (Pharmacist only)
      tags:
        - Pharmacy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
