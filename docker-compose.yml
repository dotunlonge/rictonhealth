# NOTE: in-network dependencies (postgres/redis hostnames) are hardcoded so an
# ambient .env can never poison containers with localhost/RDS URLs again.
# Dev-only defaults below (dev-secret*, ricton-secure-*) are for LOCAL dev only.
# Production uses docker-compose.prod.yml which fail-closes with ${VAR:?}.
# Override a single service for debugging with e.g.:
#   docker compose run -e DATABASE_URL=... <service> <cmd>
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ricton-postgres
    environment:
      POSTGRES_USER: ricton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ricton-secure-pg-prod-2026}
      POSTGRES_DB: ricton
    ports:
      # Overridable (POSTGRES_HOST_PORT=5433) for machines already running a
      # local postgres on 5432. Container port stays 5432 for in-network URLs.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ricton']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ricton-network

  redis:
    image: redis:7-alpine
    container_name: ricton-redis
    # #95 single shared Redis: app uses DB 0 (REDIS_URL redis://redis:6379),
    # Kong rate-limiting uses DB 1 (gateway/kong.yml redis_database: 1).
    command: redis-server --requirepass ${REDIS_PASSWORD:-ricton-secure-redis-2026}
    ports:
      # Host port is overridable (REDIS_HOST_PORT=6380) for machines already
      # running a local redis (e.g. Homebrew). Container port stays 6379 so
      # in-network REDIS_URL values keep working unchanged.
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-ricton-secure-redis-2026} ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ricton-network

  kong:
    image: kong:3.6
    container_name: ricton-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    ports:
      - '8000:8000'
      - '8443:8443'
      # #89: Kong Admin API bound to loopback only — never 0.0.0.0 in dev.
      # Values below intentionally keep dev defaults; prod fail-closes via ${VAR:?}.
      - '127.0.0.1:8001:8001'
      - '127.0.0.1:8444:8444'
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ricton-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: ricton-auth-service
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://ricton:ricton-secure-pg-prod-2026@postgres:5432/ricton?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ricton-secure-redis-2026}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret}
      OTP_SECRET: ${OTP_SECRET:-${JWT_SECRET:-dev-secret}}
      NODE_ENV: ${NODE_ENV:-development}
      PORT_AUTH: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    volumes:
      - ./packages:/app/packages
      - ./services/auth:/app/services/auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
