    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgresql://ricton:ricton-secure-pg-prod-2026@postgres:5432/ricton?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ricton-secure-redis-2026}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      INTERNAL_NOTIFICATION_URL: ${INTERNAL_NOTIFICATION_URL:-http://notification-service:3016}
    volumes:
      - ./packages:/app/packages
    command: node -e "require('./packages/shared/dist/jobs/processors').startJobProcessors()"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: unless-stopped
    networks:
      - ricton-network

volumes:
  postgres_data:
  redis_data:

networks:
  ricton-network:
    driver: bridge
