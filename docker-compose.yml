services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ricton-postgres
    environment:
      POSTGRES_USER: ricton
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ricton
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ricton']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ricton-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.6
    container_name: ricton-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    ports:
      - '8000:8000'
      - '8443:8443'
      - '8001:8001'
      - '8444:8444'
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml
# Node.js API services are run locally on the host via `yarn dev` for live-reloading.
# They are omitted from this compose file to avoid port collisions and routing chaos.

volumes:
  postgres_data:
  redis_data:
