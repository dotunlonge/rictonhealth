replicaCount: 2

image:
  repository: placeholder-account.dkr.ecr.us-east-1.amazonaws.com/ricton-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

env:
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"
# Database URL is injected via secrets or KMS in a real cluster

# These will be specific to each service
livenessProbe:
  httpGet:
    path: /health
    port: targetPort
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: targetPort
  initialDelaySeconds: 10
  periodSeconds: 10
