{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ricton-service.fullname" . }}-secrets
  labels:
    {{- include "ricton-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required (or set secrets.existingSecret)" .Values.secrets.redisUrl | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (or set secrets.existingSecret)" .Values.secrets.jwtSecret | quote }}
  {{- with .Values.secrets.refreshSecret }}
  REFRESH_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.otpSecret }}
  OTP_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.internalApiSecret }}
  INTERNAL_API_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
