{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ricton-service.fullname" . }}-secrets
  labels:
    {{- include "ricton-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required (or set secrets.existingSecret)" .Values.secrets.redisUrl | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (or set secrets.existingSecret)" .Values.secrets.jwtSecret | quote }}
  {{- with .Values.secrets.refreshSecret }}
  REFRESH_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.otpSecret }}
  OTP_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.internalApiSecret }}
  INTERNAL_API_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.paystackSecretKey }}
  PAYSTACK_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.twilioAccountSid }}
  TWILIO_ACCOUNT_SID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.twilioAuthToken }}
  TWILIO_AUTH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.twilioPhoneNumber }}
  TWILIO_PHONE_NUMBER: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sendgridApiKey }}
  SENDGRID_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sendgridFromEmail }}
  SENDGRID_FROM_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.livekitUrl }}
  LIVEKIT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.livekitApiKey }}
  LIVEKIT_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.livekitApiSecret }}
  LIVEKIT_API_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.frontendUrl }}
  FRONTEND_URL: {{ . | quote }}
  {{- end }}
{{- end }}
