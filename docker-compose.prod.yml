      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      # Canonical PORT_MESSAGING; falls back to legacy MESSAGING_PORT (both accepted in code).
      PORT_MESSAGING: ${PORT_MESSAGING:-${MESSAGING_PORT:-3012}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
