services:
  web-service:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-eu-west-2}.amazonaws.com/ricton-web:${IMAGE_TAG}
    container_name: ricton-web-service-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - kong
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ricton-network

  redis:
    image: redis:7-alpine
    container_name: ricton-redis-prod
    # Fail-closed in prod: REDIS_PASSWORD has no default (use :? to abort early).
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD_must_be_set} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD_must_be_set} ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - ricton-network

  kong:
    image: kong:3.6
    container_name: ricton-kong-prod
    restart: always
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # #89: Admin API listens inside container only and is NOT published to
      # the host (no 8001/8444 port mapping below) — never expose 0.0.0.0:8001 publicly.
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_must_be_set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD_must_be_set}
    ports:
      - '80:8000'
      - '443:8443'
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ricton-network

  db-migrate:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-eu-west-2}.amazonaws.com/ricton-db:${IMAGE_TAG}
    container_name: ricton-db-migrate-prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: 'no'
    networks:
      - ricton-network

  worker:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-eu-west-2}.amazonaws.com/ricton-auth:${IMAGE_TAG}
    container_name: ricton-worker-prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      INTERNAL_NOTIFICATION_URL: ${INTERNAL_NOTIFICATION_URL}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    command: node -e "require('./packages/shared/dist/jobs/processors').startJobProcessors()"
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - ricton-network

  auth-service:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-eu-west-2}.amazonaws.com/ricton-auth:${IMAGE_TAG}
    container_name: ricton-auth-service-prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      OTP_SECRET: ${OTP_SECRET}
      NODE_ENV: production
      PORT_AUTH: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_IOS_BUNDLE_ID: ${APPLE_IOS_BUNDLE_ID:-com.ricton.health}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ricton-network

  user-service:
