appId: com.ricton.health
name: Booking - selecting a slot enables confirmation
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: patient.home.findDoctor
- tapOn:
    id: booking.search
- inputText: Emeka
- tapOn: Emeka E2E
- assertVisible:
    id: booking.slots
- tapOn:
    id: booking.slot-0
- assertVisible:
    id: booking.confirm
- assertVisible:
    id: booking.reason
