appId: com.ricton.health
name: Booking - slot books as a PENDING request (idempotent)
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# Reseed first: the seed clears E2E-marked bookings, so slot-0 is free and
# this exact run books it. Copy never says "confirmed" — requests await the
# provider (P1 video/mobile scope).
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: patient.home.findDoctor
- tapOn:
    id: booking.search
- inputText: Emeka
- tapOn: Emeka E2E
- tapOn:
    id: booking.slot-0
- tapOn:
    id: booking.reason
- inputText: E2E maestro booking
- tapOn:
    id: booking.confirm
- assertVisible:
    id: booking.confirmed
- assertVisible: Booking requested
