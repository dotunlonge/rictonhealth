appId: com.ricton.health
name: Wallet - virtual account provisioning
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# Reseed first (seed clears the virtual account). Provisioning calls Paystack,
# so this journey needs the Paystack sandbox; the account row is server-held.
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: patient.home.wallet
- tapOn:
    id: wallet.create-account
- assertNotVisible:
    id: wallet.create-account
