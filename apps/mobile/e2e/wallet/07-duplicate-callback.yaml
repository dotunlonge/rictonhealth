appId: com.ricton.health
name: Wallet - repeated verify taps reconcile once
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# Needs the Paystack sandbox for init. Tapping verify twice must not fork
# two credits: reconciliation is reference-keyed server-side (wallet
# idempotency suite), and the screen stays put either way.
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: patient.home.wallet
- tapOn:
    id: wallet.go-topup
- tapOn:
    id: wallet.amount
- inputText: 5000
- tapOn:
    id: wallet.launch
- assertVisible:
    id: wallet.checkout-opened
- tapOn:
    id: wallet.verify
- tapOn:
    id: wallet.verify
- assertVisible:
    id: wallet.checkout-opened
