appId: com.ricton.health
name: Discovery - nonsense query honestly empties the directory
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# A nonsense query honestly empties the directory; the seeded clinician is
# back the moment the query is gone (server-filtered, unit-covered).
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: patient.home.findDoctor
- tapOn:
    id: booking.search
- inputText: zzz-no-such-doctor
- assertVisible:
    id: booking.empty
