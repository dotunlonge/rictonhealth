appId: com.ricton.health
name: Account - 2FA setup reveals a secret
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# Reseed first (seed clears 2FA). Stops at the secret display: completing
# verification would gate every later login behind TOTP (manual step).
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: navigation.account
- tapOn:
    id: account.security
- tapOn:
    id: account.2fa-enable
- assertVisible:
    id: account.2fa-secret
