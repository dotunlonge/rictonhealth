appId: com.ricton.health
name: Account - wrong current password changes nothing
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# A wrong current password must never rotate credentials: the request is
# rejected and the screen stays put with an error (never use the real
# password here — a successful change would lock out later journeys).
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: navigation.account
- tapOn:
    id: account.security
- assertVisible:
    id: account.security.screen
- tapOn:
    id: account.current-password
- inputText: wrong-password-000
- tapOn:
    id: account.new-password
- inputText: E2eChanged456!
- tapOn:
    id: account.confirm-password
- inputText: E2eChanged456!
- tapOn:
    id: account.change-password
- assertVisible:
    id: account.security.screen
- assertNotVisible:
    id: account.password-changed
