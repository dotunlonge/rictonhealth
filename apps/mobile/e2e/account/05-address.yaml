appId: com.ricton.health
name: Account - delivery address add and list
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- tapOn:
    id: navigation.account
- tapOn:
    id: account.addresses
- assertVisible:
    id: account.addresses.screen
- tapOn:
    id: account.addr-label
- inputText: E2E Home
- tapOn:
    id: account.addr-city
- inputText: Lagos
- tapOn:
    id: account.addr-add
- assertVisible: E2E Home
