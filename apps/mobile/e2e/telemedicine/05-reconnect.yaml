appId: com.ricton.health
name: Telemedicine - 05-reconnect
env:
  E2E_PATIENT_EMAIL: ${E2E_PATIENT_EMAIL}
  E2E_PATIENT_PASSWORD: ${E2E_PATIENT_PASSWORD}
---
# Controls stay live across a reconnect. Manual network-kill variant: enable
# airplane mode for 10s mid-call, then expect tele.reconnecting followed by
# tele.active again. This automated variant proves toggles + clean leave.
- clearState
- launchApp
- tapOn:
    id: auth.signIn.email
- inputText: ${E2E_PATIENT_EMAIL}
- tapOn:
    id: auth.signIn.password
- inputText: ${E2E_PATIENT_PASSWORD}
- tapOn:
    id: auth.signIn.submit
- assertVisible:
    id: patient.home.screen
- tapOn:
    id: navigation.appointments
- tapOn:
    id: patient.appointments.joinVideo
- tapOn:
    id: tele.join
- assertVisible:
    id: tele.active
- tapOn:
    id: tele.mic.toggle
- tapOn:
    id: tele.mic.toggle
- tapOn:
    id: tele.camera.toggle
- tapOn:
    id: tele.camera.toggle
- assertVisible:
    id: tele.active
- tapOn:
    id: tele.leave
- assertVisible:
    id: tele.summary
