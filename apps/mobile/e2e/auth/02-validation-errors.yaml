appId: com.ricton.health
name: Auth - validation errors block submit
---
- clearState
- launchApp
- assertVisible:
    id: auth.signIn.screen
- tapOn:
    id: auth.signIn.createAccount
- assertVisible:
    id: auth.register.screen
- tapOn:
    id: auth.register.submit
- assertVisible:
    id: auth.register.error
- assertNotVisible:
    id: patient.home.screen
