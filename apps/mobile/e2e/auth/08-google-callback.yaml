appId: com.ricton.health
name: Auth - Google button is wired (tap-through is sandbox)
---
# The native button renders only when EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID is set;
# tapping it opens the OS account sheet, which Maestro cannot drive, so the
# tap-through stays a manual sandbox step (service unit-covered).
- clearState
- launchApp
- assertVisible:
    id: auth.signIn.screen
- assertVisible:
    id: auth.signIn.google
