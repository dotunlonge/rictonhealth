appId: com.ricton.health
name: Auth - Apple button is wired (tap-through is sandbox)
---
# The Apple button renders only on iOS with the Sign-in entitlement (this flow
# is iOS-only); the OS sheet is manual (service unit-covered by provider tests).
- clearState
- launchApp
- assertVisible:
    id: auth.signIn.screen
- assertVisible:
    id: auth.signIn.apple
