_format_version: '3.0'

consumers:
  - username: ricton-client
    jwt_secrets:
      - key: ricton-issuer
        secret: ${JWT_SECRET}
        algorithm: HS256

plugins:
  - name: rate-limiting
    config:
      minute: 60
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_password: ${REDIS_PASSWORD}
services:
  - name: auth-service
    url: http://auth-service:3001
    plugins:
      # Edge abuse containment for the credential-stuffing target. App-level
      # limiters remain authoritative; this sheds bot floods before they do.
      - name: rate-limiting
        config:
          minute: 30
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          fault_tolerant: false
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: false

  - name: user-service
    url: http://user-service:3002
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: user-routes
        paths:
          - /api/users
        strip_path: false

  - name: docs-service
    url: http://docs-service:3003
    routes:
      - name: docs-routes
        paths:
          - /docs
        strip_path: false

  - name: payment-service
    url: http://payment-service:3007
    routes:
      - name: payment-routes
        paths:
          - /api/payments
        strip_path: false

  - name: wallet-service
    url: http://wallet-service:3008
    routes:
      - name: wallet-routes
        paths:
          - /api/wallets
        strip_path: false

  - name: appointment-service
    url: http://appointment-service:3005
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: appointment-routes
        paths:
          - /api/appointments
        strip_path: false

  - name: prescription-service
    url: http://prescription-service:3004
    routes:
      - name: prescription-routes
        paths:
          - /api/prescriptions
        strip_path: false

  - name: telemedicine-service
    url: http://telemedicine-service:3013
    routes:
      # Provider-signed webhooks carry no JWT (LiveKit cannot); they
      # authenticate via HMAC in the service. This route must precede the
      # JWT-gated route and carry no jwt plugin.
      - name: telemedicine-callbacks
        paths:
          - /api/telemedicine/callbacks
        strip_path: false
      - name: telemedicine-routes
        paths:
          - /api/telemedicine
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: pharmacy-service
    url: http://pharmacy-service:3014
    routes:
      - name: pharmacy-routes
        paths:
          - /api/pharmacy
        strip_path: false

  - name: notification-service
    url: http://notification-service:3016
    routes:
      - name: notification-routes
        paths:
          - /api/notifications
        strip_path: false

  - name: messaging-service
    url: http://messaging-service:3012
    routes:
      - name: messaging-routes
        paths:
          - /api/messages
        strip_path: false

  - name: subscription-service
    url: http://subscription-service:3009
    routes:
      - name: subscription-routes
        paths:
          - /api/subscriptions
        strip_path: false

  - name: rewards-service
    url: http://rewards-service:3011
    routes:
      - name: rewards-routes
        paths:
          - /api/rewards
        strip_path: false

  - name: address-service
    url: http://address-service:3015
    routes:
      - name: address-routes
        paths:
          - /api/addresses
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:3006
    routes:
      - name: analytics-routes
        paths:
          - /api/analytics
        strip_path: false

  - name: admin-service
    url: http://admin-service:3010
    routes:
      - name: admin-routes
        paths:
          - /api/admin
        strip_path: false

  - name: smartguard-service
    url: http://smartguard-service:3017
    routes:
      - name: smartguard-routes
        paths:
          - /api/smartguard
        strip_path: false
