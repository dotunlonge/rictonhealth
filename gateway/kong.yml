_format_version: '3.0'

# #92 default-deny intent: every private /api/* service must carry a `jwt`
# plugin (key_claim iss, verify exp) unless it has an explicit public-route
# carve-out documented inline (auth login/refresh, telemedicine provider
# callbacks). Add new services WITH jwt by default; public exceptions get a
# route-level plugin override + comment, never a bare service.
consumers:
  - username: ricton-client
    jwt_secrets:
      - key: ricton-issuer
        secret: ${JWT_SECRET}
        algorithm: HS256

plugins:
  # #95 Redis DB index separation: single shared Redis instance.
  # App sessions/cache/pubsub use DB 0 (REDIS_URL without /N suffix).
  # Kong rate-limiting counters use DB 1 (redis_database: 1) so FLUSHDB /
  # key churn on one side never evicts the other. ElastiCache (redis.tf)
  # is a single replication group — no new infra.
  - name: rate-limiting
    config:
      minute: 60
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_password: ${REDIS_PASSWORD}
      redis_database: 1
      # fault_tolerant omitted (= true, fail-open): a Redis blip degrades to
      # unthrottled rather than 500ing all traffic at the edge.
services:
  - name: auth-service
    url: http://auth-service:3001
    plugins:
      # Edge abuse containment for the credential-stuffing target. App-level
      # limiters remain authoritative; this sheds bot floods before they do.
      - name: rate-limiting
        config:
          minute: 30
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASSWORD}
          redis_database: 1 # #95: Kong counters on DB 1; app uses DB 0.
          # fault_tolerant: false (fail-closed) is intentional here: the
          # login path must not go unthrottled during a Redis outage.
          fault_tolerant: false
    routes:
      # ACME must have a hostname-and-path match so it can intercept the
      # HTTP-01 challenge before proxying to the auth upstream.
      - name: acme-http01-routes
        hosts:
          - ${API_DOMAIN}
        paths:
          - /.well-known/acme-challenge
        strip_path: false
      - name: auth-routes
        hosts:
          - ${API_DOMAIN}
        paths:
          - /api/auth
        strip_path: false

  - name: user-service
    url: http://user-service:3002
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: user-routes
        paths:
          - /api/users
        strip_path: false

  - name: docs-service
    url: http://docs-service:3003
    routes:
      - name: docs-routes
        paths:
          - /docs
        strip_path: false

  - name: payment-service
    url: http://payment-service:3007
    # #A2 timeouts: bound upstream waits so slow payment provider calls
    # fail fast instead of holding Kong workers.
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 2
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: payment-routes
        paths:
          - /api/payments
        strip_path: false

  - name: wallet-service
    url: http://wallet-service:3008
    # #A2 timeouts: same bounds as payment (ledger calls must fail fast).
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 2
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: wallet-routes
        paths:
          - /api/wallets
        strip_path: false

  - name: appointment-service
    url: http://appointment-service:3005
    # #A2 timeouts: scheduling path bound so slot contention fails fast.
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    retries: 2
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: appointment-routes
        paths:
          - /api/appointments
        strip_path: false

  - name: prescription-service
    url: http://prescription-service:3004
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: prescription-routes
        paths:
          - /api/prescriptions
        strip_path: false

  - name: telemedicine-service
    url: http://telemedicine-service:3013
    routes:
      # Provider-signed webhooks carry no JWT (LiveKit cannot); they
      # authenticate via HMAC in the service. This route must precede the
      # JWT-gated route and carry no jwt plugin.
      - name: telemedicine-callbacks
        paths:
          - /api/telemedicine/callbacks
        strip_path: false
      - name: telemedicine-routes
        paths:
          - /api/telemedicine
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  - name: pharmacy-service
    url: http://pharmacy-service:3014
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: pharmacy-routes
        paths:
          - /api/pharmacy
        strip_path: false

  - name: notification-service
    url: http://notification-service:3016
    routes:
      - name: notification-routes
        paths:
          - /api/notifications
        strip_path: false

  - name: messaging-service
    url: http://messaging-service:3012
    routes:
      - name: messaging-routes
        paths:
          - /api/messages
        strip_path: false

  - name: subscription-service
    url: http://subscription-service:3009
    routes:
      - name: subscription-routes
        paths:
          - /api/subscriptions
        strip_path: false

  - name: rewards-service
    url: http://rewards-service:3011
    routes:
      - name: rewards-routes
        paths:
          - /api/rewards
        strip_path: false

  - name: address-service
    url: http://address-service:3015
    routes:
      - name: address-routes
        paths:
          - /api/addresses
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:3006
    routes:
      - name: analytics-routes
        paths:
          - /api/analytics
        strip_path: false

  - name: admin-service
    url: http://admin-service:3010
    routes:
      - name: admin-routes
        paths:
          - /api/admin
        strip_path: false
      # #107 Force-update gate: public carve-out (default-deny intent above
      # applies to authenticated /api/* services; this dependency-free
      # endpoint is safe unauthenticated — mobile checks it pre-login).
      # strip_path: true so gateway /api/version lands on admin GET /version.
      - name: version-route
        paths:
          - /api/version
        strip_path: true

  - name: smartguard-service
    url: http://smartguard-service:3017
    routes:
      - name: smartguard-routes
        paths:
          - /api/smartguard
        strip_path: false
