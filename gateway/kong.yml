_format_version: '3.0'

consumers:
  - username: ricton-client
    jwt_secrets:
      - key: ricton-issuer
        secret: ${JWT_SECRET}
        algorithm: HS256

plugins:
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 60
      policy: redis
      redis_host: ricton-redis
      redis_port: 6379
services:
  - name: auth-service
    url: http://host.docker.internal:3001
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: false

  - name: user-service
    url: http://host.docker.internal:3002
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
    routes:
      - name: user-routes
        paths:
          - /api/users
        strip_path: false

  - name: docs-service
    url: http://host.docker.internal:3003
    routes:
      - name: docs-routes
        paths:
          - /docs
        strip_path: false

  - name: payment-service
    url: http://host.docker.internal:3007
    routes:
      - name: payment-routes
        paths:
          - /api/payments
        strip_path: false

  - name: wallet-service
    url: http://host.docker.internal:3008
    routes:
      - name: wallet-routes
        paths:
          - /api/wallets
        strip_path: false

# Other services will be added here as they are built
