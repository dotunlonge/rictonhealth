name: AWS ECR Microservices CI/CD Pipeline

# #111 required checks: deploy gating across workflows cannot use `needs`
# (needs only references jobs in THIS file). The E2E gate is
# ci.yml job `e2e-browser` — enforce it via branch protection required
# status checks on main/master, not here. Within this workflow the chain
# typecheck-and-test -> build-and-push-ecr -> deploy-to-staging already
# blocks deploys on unit/contract/integration failures.
# #110 image pin: releases are immutable — IMAGE_TAG is ${{ github.sha }}
# everywhere below; helm callers must pass --set image.tag=${{ github.sha }}
# (never :latest; see infra/helm/ricton-service/values*.yaml comments).

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  typecheck-and-test:
    name: 🧪 Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=@ricton/db

      - name: Run Typecheck
        run: npm run typecheck

      - name: Typecheck Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Typecheck Mobile
        # Must run via the workspace script: mobile pins TypeScript 6 and root tsc cannot parse its tsconfig.
        run: npm -w apps/mobile run typecheck

      - name: Run Contract Tests (no Docker)
        run: npm run test:contracts

      - name: Lint and Build Web
        run: |
          npm -w apps/web run lint
          npm -w apps/web run build

      - name: Test Mobile
        run: npm -w apps/mobile run test:ci

      - name: Run Integration Tests
        run: ./scripts/test-e2e.sh

  build-and-push-ecr:
    name: 🚀 Build & Push Docker Images to AWS ECR
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -a -f || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push All Microservices to AWS ECR
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID || secrets.APPLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
        run: |
          chmod +x scripts/aws-ecr-push.sh
          ./scripts/aws-ecr-push.sh

  deploy-to-staging:
    name: 🚀 Deploy to Staging (docker compose)
    needs: build-and-push-ecr
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (kong render)
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install Dependencies (kong render)
        run: npm ci --ignore-scripts

      - name: Prepare deployment bundle
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          MESSAGING_PORT: ${{ secrets.MESSAGING_PORT || 3012 }}
          PHARMACY_PORT: ${{ secrets.PHARMACY_PORT || 3014 }}
          NOTIFICATION_PORT: ${{ secrets.NOTIFICATION_PORT || 3016 }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          INTERNAL_NOTIFICATION_URL: ${{ secrets.INTERNAL_NOTIFICATION_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_PREFERRED_BANK: ${{ secrets.PAYSTACK_PREFERRED_BANK }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_IOS_BUNDLE_ID: ${{ secrets.APPLE_IOS_BUNDLE_ID }}
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID || secrets.APPLE_CLIENT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TELEMEDICINE_CALLBACK_URL: ${{ secrets.TELEMEDICINE_CALLBACK_URL }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # --- Domain attach derivations (zero console): explicit secrets win,
          # derived values fill the rest. Nothing here requires AWS clicks.
          # API_DOMAIN: explicit secret, else the host of NEXT_PUBLIC_API_URL
          # (never localhost/private IPs — LE cannot issue for those).
          if [ -z "${API_DOMAIN:-}" ] && [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
            CANDIDATE="$(echo "$NEXT_PUBLIC_API_URL" | sed -E 's|https?://([^/:]+).*|\1|')"
            if echo "$CANDIDATE" | grep -Eq '^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$|.*\.local)$'; then
              API_DOMAIN=""
            else
              API_DOMAIN="$CANDIDATE"
            fi
          fi
          # Telemedicine callback: explicit secret, else <api-base>/telemedicine/callbacks/status.
          if [ -z "${TELEMEDICINE_CALLBACK_URL:-}" ] && [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
            API_BASE="${NEXT_PUBLIC_API_URL%/}"
            if [[ "$API_BASE" == */api ]]; then
              TELEMEDICINE_CALLBACK_URL="${API_BASE}/telemedicine/callbacks/status"
            else
              TELEMEDICINE_CALLBACK_URL="${API_BASE}/api/telemedicine/callbacks/status"
            fi
          fi
          # CORS: the browser's Origin is the frontend (Vercel) origin, not
          # the API host it calls.  Add FRONTEND_URL so a fresh domain cutover
          # cannot deploy an API that immediately rejects every browser call.
          if [ -n "${FRONTEND_URL:-}" ]; then
            FRONTEND_ORIGIN="${FRONTEND_URL%/}"
            case ",${ALLOWED_ORIGINS:-}," in
              *",${FRONTEND_ORIGIN},"*) ;;
              *)
                if [ -z "${ALLOWED_ORIGINS:-}" ]; then
                  ALLOWED_ORIGINS="${FRONTEND_ORIGIN}"
                else
                  ALLOWED_ORIGINS="${ALLOWED_ORIGINS},${FRONTEND_ORIGIN}"
                fi
                ;;
            esac
          fi
          echo "API_DOMAIN=${API_DOMAIN:-}" >> "$GITHUB_ENV"
          cat > .env.production <<EOF
          NODE_ENV="production"
          DATABASE_URL="${DATABASE_URL}"
          REDIS_URL="${REDIS_URL}"
          REDIS_PASSWORD="${REDIS_PASSWORD}"
          JWT_SECRET="${JWT_SECRET}"
          REFRESH_SECRET="${REFRESH_SECRET}"
          OTP_SECRET="${OTP_SECRET}"
          TOTP_ENCRYPTION_KEY="${TOTP_ENCRYPTION_KEY}"
          MESSAGING_PORT="${MESSAGING_PORT}"
          PHARMACY_PORT="${PHARMACY_PORT}"
          NOTIFICATION_PORT="${NOTIFICATION_PORT}"
          INTERNAL_API_SECRET="${INTERNAL_API_SECRET}"
          INTERNAL_NOTIFICATION_URL="${INTERNAL_NOTIFICATION_URL}"
          ALLOWED_ORIGINS="${ALLOWED_ORIGINS}"
          FRONTEND_URL="${FRONTEND_URL}"
          AWS_REGION="${AWS_REGION}"
          AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID}"
          IMAGE_TAG="${IMAGE_TAG}"
          NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}"
          PAYSTACK_SECRET_KEY="${PAYSTACK_SECRET_KEY}"
          PAYSTACK_PUBLIC_KEY="${PAYSTACK_PUBLIC_KEY}"
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY="${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}"
          PAYSTACK_PREFERRED_BANK="${PAYSTACK_PREFERRED_BANK}"
          GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
          GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID}"
          GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID="${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
          APPLE_CLIENT_ID="${APPLE_CLIENT_ID}"
          APPLE_IOS_BUNDLE_ID="${APPLE_IOS_BUNDLE_ID}"
          NEXT_PUBLIC_APPLE_CLIENT_ID="${NEXT_PUBLIC_APPLE_CLIENT_ID}"
          TWILIO_ACCOUNT_SID="${TWILIO_ACCOUNT_SID}"
          TWILIO_API_KEY="${TWILIO_API_KEY}"
          TWILIO_API_SECRET="${TWILIO_API_SECRET}"
          TWILIO_AUTH_TOKEN="${TWILIO_AUTH_TOKEN}"
          TWILIO_PHONE_NUMBER="${TWILIO_PHONE_NUMBER}"
          TELEMEDICINE_CALLBACK_URL="${TELEMEDICINE_CALLBACK_URL}"
          LIVEKIT_URL="${LIVEKIT_URL}"
          LIVEKIT_API_KEY="${LIVEKIT_API_KEY}"
          LIVEKIT_API_SECRET="${LIVEKIT_API_SECRET}"
          SENDGRID_API_KEY="${SENDGRID_API_KEY}"
          SENDGRID_FROM_EMAIL="${SENDGRID_FROM_EMAIL}"
          SENTRY_DSN="${SENTRY_DSN}"
          SENTRY_TRACES_SAMPLE_RATE="${SENTRY_TRACES_SAMPLE_RATE}"
          AWS_S3_BUCKET_NAME="${AWS_S3_BUCKET_NAME}"
          AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
          AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
          EOF
          # Render Kong TLS: ACME plugin only when API_DOMAIN + ACME_EMAIL are
          # set, else the source config ships byte-identical (HTTP as today).
          KONG_IN=gateway/kong.yml KONG_OUT=gateway/kong.deploy.yml \
            API_DOMAIN="${API_DOMAIN:-}" ACME_EMAIL="${ACME_EMAIL:-}" \
            NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-}" \
            npx ts-node -O '{"module":"commonjs"}' scripts/render-kong-tls.ts
          echo "Effective API_DOMAIN=${API_DOMAIN:-<none>}"

      - name: Configure AWS Credentials (domain attach)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Attach backend domain (DNS + firewall, zero console)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          API_DOMAIN: ${{ env.API_DOMAIN }}
        run: |
          if [ -z "${API_DOMAIN:-}" ]; then
            echo "No API_DOMAIN — skipping domain attach (HTTP as today)."
            exit 0
          fi
          # Resolve the staging host to an IPv4 address.
          if [[ "$STAGING_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            HOST_IP="$STAGING_HOST"
          else
            HOST_IP="$(getent hosts "$STAGING_HOST" | awk '{print $1}' | grep -E '^[0-9.]+$' | head -1 || true)"
          fi
          if [ -z "${HOST_IP:-}" ]; then
            echo "::warning::Could not resolve STAGING_HOST to an IP — add an A record for ${API_DOMAIN} manually."
            exit 0
          fi
          # Upsert the A record in Route53 when the parent zone lives there;
          # otherwise print the single manual record needed.
          PARENT="$(echo "$API_DOMAIN" | rev | cut -d. -f1-2 | rev)"
          ZONE_ID="$(aws route53 list-hosted-zones-by-name --dns-name "${PARENT}." --query "HostedZones[?Name=='${PARENT}.'].Id" --output text 2>/dev/null || true)"
          if [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != "None" ]; then
            aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" --change-batch "{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"${API_DOMAIN}.\",\"Type\":\"A\",\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"${HOST_IP}\"}]}}]}" \
              || echo "::warning::Route53 upsert failed — add A ${API_DOMAIN} -> ${HOST_IP} manually."
            # Open 80/443 on the host's security groups (best effort).
            SG_IDS="$(aws ec2 describe-instances --filters "Name=ip-address,Values=${HOST_IP}" --query "Reservations[].Instances[].SecurityGroups[].GroupId" --output text 2>/dev/null || true)"
            for SG in $SG_IDS; do
              for PORT in 80 443; do
                aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port "$PORT" --cidr 0.0.0.0/0 2>/dev/null \
                  || echo "Port $PORT already open on $SG (or unauthorized)."
              done
            done
          else
            echo "::warning::No Route53 zone for ${PARENT} — add one A record: ${API_DOMAIN} -> ${HOST_IP}."
          fi

      - name: Sync bundle to staging host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER || 'ubuntu' }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_SSH_PRIVATE_KEY" ]; then
            echo "::error::STAGING_HOST and STAGING_SSH_PRIVATE_KEY secrets are required for deployment."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "${STAGING_USER}@${STAGING_HOST}" "mkdir -p /opt/ricton/gateway /opt/ricton/scripts"
          scp -i ~/.ssh/id_ed25519 docker-compose.prod.yml .env.production openapi.yaml "${STAGING_USER}@${STAGING_HOST}:/opt/ricton/"
          scp -i ~/.ssh/id_ed25519 gateway/kong.deploy.yml "${STAGING_USER}@${STAGING_HOST}:/opt/ricton/gateway/kong.yml"

      - name: Snapshot RDS before migrate (#97 backup gate)
        # #97: snapshot-before-migrate. RDS identifier is ricton-<env>
        # (see infra/terraform/rds.tf); override via RDS_INSTANCE_ID secret.
        # Fail-closed: no continue-on-error — a snapshot failure must stop
        # prod before `db-migrate` runs. Skips with a warning ONLY when the
        # instance does not exist (non-RDS staging database).
        env:
          RDS_INSTANCE_ID: ${{ secrets.RDS_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
        run: |
          INSTANCE="${RDS_INSTANCE_ID:-ricton-staging}"
          SNAP="pre-migrate-${GITHUB_SHA:0:8}-$(date +%Y%m%d%H%M%S)"
          if aws rds describe-db-instances --db-instance-identifier "$INSTANCE" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws rds create-db-snapshot --db-instance-identifier "$INSTANCE" --db-snapshot-identifier "$SNAP" --region "$AWS_REGION"
            aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP" --region "$AWS_REGION"
            echo "RDS snapshot ready: $SNAP"
          else
            echo "::warning::RDS instance $INSTANCE not found — skipping snapshot (non-RDS staging DB). Prod must set RDS_INSTANCE_ID."
          fi

      - name: Run migrations and deploy containers
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${STAGING_USER}@${STAGING_HOST}" '
            set -e
            cd /opt/ricton
            export AWS_ACCOUNT_ID=$(grep -oP "(?<=^AWS_ACCOUNT_ID=\").*(?=\")" .env.production)
            export AWS_REGION=$(grep -oP "(?<=^AWS_REGION=\").*(?=\")" .env.production)
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d redis
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm db-migrate
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --pull always
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
          '

      - name: Post-deploy smoke gate (#110)
        # #110: health/ready curl loop (via SSH, localhost on the host) +
        # scripts/load-smoke.js from the runner. No continue-on-error: any
        # smoke failure fails the deploy.
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER || 'ubuntu' }}
          API_DOMAIN: ${{ env.API_DOMAIN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${STAGING_USER}@${STAGING_HOST}" '
            set -e
            for PORT in 3000 3001 3002 3003 3004 3005 3006 3007 3008 3009 3010 3011 3012 3013 3014 3015 3016 3017; do
              for i in $(seq 1 12); do
                curl -sf -o /dev/null "http://localhost:${PORT}/health" && break
                [ "$i" -eq 12 ] && { echo "health check failed: port ${PORT}"; exit 1; }
                sleep 10
              done
            done
            curl -sf -o /dev/null http://localhost:3001/ready
            curl -sf -o /dev/null http://localhost:3005/ready
            echo "All service /health checks + sample /ready checks passed."
          '
          if [ -n "${API_DOMAIN:-}" ]; then
            SMOKE_BASE="https://${API_DOMAIN}"
          else
            SMOKE_BASE="http://${STAGING_HOST}"
          fi
          curl -sf -o /dev/null "${SMOKE_BASE}/" || echo "::warning::Gateway root not reachable at ${SMOKE_BASE}/ — continuing to load smoke."
          BASE_URL="$SMOKE_BASE" node scripts/load-smoke.js
