name: ricton-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ricton_test_user
      POSTGRES_PASSWORD: ricton_test_password
      POSTGRES_DB: ricton_test_db
    ports:
      # Keep test infrastructure separate from the development database on 5433
      # and other local projects using 5434.
      - '127.0.0.1:5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ricton_test_user -d ricton_test_db']
      interval: 2s
      timeout: 5s
      retries: 10

  test-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ricton_test_redis_password
    ports:
      - '127.0.0.1:6382:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ricton_test_redis_password ping || exit 1']
      interval: 2s
      timeout: 5s
      retries: 10
